# fly.toml app configuration file generated for heirright-docprep-worker on 2026-08-04T15:50:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "heirright-docprep-worker"
primary_region = 'iad'

[build]
  dockerfile = "deploy/heirright-process/Dockerfile.worker"

[processes]
  app = 'node apps/docprep-worker/dist/index.js'

[http_service]
  auto_start_machines = true
  auto_stop_machines = 'off'
  force_https = true
  internal_port = 8080
  min_machines_running = 2
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 1024
