# fly.toml app configuration file generated for heirright-docprep-api on 2026-08-04T15:17:49Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'heirright-docprep-api'
primary_region = 'ord'

[build]
  dockerfile = 'deploy/heirright-process/Dockerfile.api'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '20s'
    method = 'get'
    path = '/readyz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
