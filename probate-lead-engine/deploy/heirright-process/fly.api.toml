app = "heirright-docprep-api"
primary_region = "iad"

[build]
  dockerfile = "deploy/heirright-process/Dockerfile.api"

[deploy]
  release_command = "node apps/docprep-api/dist/migrate.js"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "get"
    path = "/readyz"
